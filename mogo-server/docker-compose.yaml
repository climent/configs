services:
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on: [admin-api, redirect-api, frontend]

  mongo:
    image: mongo:latest
    volumes: ["mongo_data:/data/db"]
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1  # <-- Fixes the TCMalloc crash on Linux 6.19+

  admin-api:
    build: ./admin-api
    environment: ["MONGO_URI=mongodb://mongo:27017/urlshortener"]
    depends_on: [mongo]

  redirect-api:
    build: ./redirect-api
    environment: ["MONGO_URI=mongodb://mongo:27017/urlshortener"]
    depends_on: [mongo]

  frontend:
    build: ./frontend

volumes:
  mongo_data:
