services:
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on: [admin-api, redirect-api, frontend]
    restart: unless-stopped
    pull_policy: always

  mongo:
    image: mongo:latest
    volumes: ["mongo_data:/data/db"]
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1  # <-- Fixes the TCMalloc crash on Linux 6.19+
    restart: unless-stopped
    pull_policy: always

  admin-api:
    build: ./admin-api
    environment: ["MONGO_URI=mongodb://mongo:27017/urlshortener"]
    depends_on: [mongo]
    restart: unless-stopped

  redirect-api:
    build: ./redirect-api
    environment: ["MONGO_URI=mongodb://mongo:27017/urlshortener"]
    depends_on: [mongo]
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

volumes:
  mongo_data:
