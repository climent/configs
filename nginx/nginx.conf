events {
    worker_connections 1024;
}

http {
    # Redirect 'navidrome' to localhost:4533
    server {
        listen 80;
        server_name navidrome www.navidrome navidrome.kako.org www.navidrome.kako.org 192.168.0.38;

        location / {
            proxy_pass http://host.docker.internal:4533;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect 'playa-info' to localhost:3000
    server {
        listen 80;
        server_name playa-info www.playa-info playa-info.kako.org www.playa-info.kako.org pi pi.kako.org www.pi www.pi.kako.org;

        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect 'yubal' to localhost:8000
    server {
        listen 80;
        server_name yubal www.yubal yubal.kako.org www.yubal.kako.org;

        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect 'n8n' to localhost:5678
    server {
        listen 80;
        server_name n8n www.n8n n8n.kako.org www.n8n.kako.org;

        location / {
            proxy_pass http://host.docker.internal:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Optional but recommended for n8n web sockets
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }

    # Redirect 'mogo' and 'admin.mogo' to mogo-server stack
    server {
        listen 80;
        server_name mogo admin.mogo mogo.kako.org admin.mogo.kako.org;

        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Respond to 'kako.org' locally
    server {
        listen 80;
        server_name kako.org www.kako.org;

        location / {
            return 200 "Welcome to kako.org (Local)";
            add_header Content-Type text/plain;
        }
    }
}
