events {
    worker_connections 1024;
}

http {
    # Redirect 'yubal' to localhost:8000
    server {
        listen 80;
        server_name yubal www.yubal;

        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect 'n8n' to localhost:5678
    server {
        listen 80;
        server_name n8n www.n8n;

        location / {
            proxy_pass http://host.docker.internal:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Optional but recommended for n8n web sockets
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }

    # Redirect 'mogo' and 'admin.mogo' to mogo-server stack
    server {
        listen 80;
        server_name mogo admin.mogo;

        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
