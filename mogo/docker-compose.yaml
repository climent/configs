services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1  # <-- Fixes the TCMalloc crash on Linux 6.19+

  backend:
    build: ./backend # Path to your Node.js app
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/urlshortener
    depends_on:
      - mongo

  frontend:
    build: ./frontend # Path to your HTML/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
