<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-10 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Input Section -->
        <div class="bg-white p-8 rounded-xl shadow-lg mb-10 border-t-4 border-blue-600">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">URL Shortener</h1>
            <p class="text-gray-500 mb-6 text-sm">Paste a link and choose an optional alias.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Destination URL</label>
                    <input id="longUrl" type="text" placeholder="google.com" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Custom Alias (Optional)</label>
                    <input id="customCode" type="text" placeholder="my-custom-link" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
            </div>
            <button onclick="shortenUrl()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md">Create Link</button>
        </div>

        <!-- Dashboard Section -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-700">Analytics Dashboard</h2>
                <button onclick="loadLinks()" class="bg-blue-50 text-blue-600 px-4 py-1 rounded-md text-sm font-bold hover:bg-blue-100">Refresh List</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-400 uppercase text-xs">
                        <tr>
                            <th class="p-4">Short Link</th>
                            <th class="p-4">Original URL</th>
                            <th class="p-4 text-center">Clicks</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="linksTable" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        //const API_BASE = window.location.protocol + "//" + window.location.hostname + ":5000";
        const API_BASE = "http://192.168.64.4:5000";

        async function loadLinks() {
            const tbody = document.getElementById('linksTable');
            try {
                const res = await fetch(`${API_BASE}/api/links`);
                const links = await res.json();
                tbody.innerHTML = links.map(link => `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-4 font-bold text-blue-600">
                            <a href="${API_BASE}/${link.shortCode}" target="_blank">/${link.shortCode}</a>
                        </td>
                        <td class="p-4 text-gray-500 truncate max-w-xs">${link.longUrl}</td>
                        <td class="p-4 text-center">
                            <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">${link.clicks}</span>
                        </td>
                        <td class="p-4 text-right">
                            <button onclick="copyToClipboard('${API_BASE}/${link.shortCode}')" class="text-blue-500 hover:text-blue-700 mr-3 font-medium text-sm">Copy</button>
                            <button onclick="deleteLink('${link.shortCode}')" class="text-red-400 hover:text-red-600 text-sm">Delete</button>
                        </td>
                    </tr>
                `).join('');
                if (links.length === 0) tbody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-gray-400'>No links created yet</td></tr>";
            } catch (e) { 
                tbody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-red-500 font-bold'>Error: Backend Unreachable</td></tr>"; 
            }
        }

        async function shortenUrl() {
            const longUrl = document.getElementById('longUrl').value;
            const customCode = document.getElementById('customCode').value;
            if(!longUrl) return alert("Please enter a URL");
            
            try {
                const res = await fetch(`${API_BASE}/api/shorten`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ longUrl, customCode })
                });
                
                const data = await res.json();

                if (res.ok) {
                    loadLinks();
                    document.getElementById('longUrl').value = '';
                    document.getElementById('customCode').value = '';
                } else {
                    // FIX: access data.error instead of the whole object
                    alert("Error: " + (data.error || "Unknown error occurred"));
                }
            } catch (err) {
                alert("Critical error: Could not contact server");
            }
        }

        async function deleteLink(code) {
            if(confirm(`Permanently delete link /${code}?`)) {
                await fetch(`${API_BASE}/api/links/${code}`, { method: 'DELETE' });
                loadLinks();
            }
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Link copied!");
        }

        window.onload = loadLinks;
    </script>
</body>
</html>
