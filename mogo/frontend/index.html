<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShort Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-10">
    <div class="max-w-4xl mx-auto">
        <!-- Shortener Card -->
        <div class="bg-white p-8 rounded-xl shadow-lg mb-10">
            <h1 class="text-3xl font-extrabold text-blue-600 mb-6">Shorten a URL</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input id="longUrl" type="url" placeholder="Paste long URL..." class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                <input id="customCode" type="text" placeholder="Custom alias (optional)" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>
            <button onclick="shortenUrl()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Shorten Now</button>
        </div>

        <!-- Dashboard Table -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-700">My Links</h2>
                <button onclick="loadLinks()" class="bg-gray-200 px-4 py-1 rounded-md text-sm hover:bg-gray-300">Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                        <tr>
                            <th class="p-4">Short Code</th>
                            <th class="p-4">Original URL</th>
                            <th class="p-4 text-center">Clicks</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="linksTable" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        //const API_BASE = window.location.protocol + "//" + window.location.hostname + ":5000";
        const API_BASE = "http://192.168.64.4:5000";

        async function loadLinks() {
            const tbody = document.getElementById('linksTable');
            try {
                const res = await fetch(`${API_BASE}/api/links`);
                const links = await res.json();
                tbody.innerHTML = links.map(link => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-bold text-blue-600">
                            <a href="${API_BASE}/${link.shortCode}" target="_blank">${link.shortCode}</a>
                        </td>
                        <td class="p-4 text-gray-500 truncate max-w-xs">${link.longUrl}</td>
                        <td class="p-4 text-center"><span class="bg-blue-100 px-2 py-1 rounded text-xs font-bold">${link.clicks}</span></td>
                        <td class="p-4 text-right">
                            <button onclick="copyToClipboard('${API_BASE}/${link.shortCode}')" class="text-blue-500 mr-3">Copy</button>
                            <button onclick="deleteLink('${link.shortCode}')" class="text-red-500">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { tbody.innerHTML = "<tr><td class='p-4 text-red-500'>Connection error</td></tr>"; }
        }

        async function shortenUrl() {
            const longUrl = document.getElementById('longUrl').value;
            const customCode = document.getElementById('customCode').value;
            if(!longUrl) return alert("Enter URL");
            
            const res = await fetch(`${API_BASE}/api/shorten`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ longUrl, customCode })
            });
            if (res.ok) { loadLinks(); document.getElementById('longUrl').value = ''; document.getElementById('customCode').value = ''; }
            else { alert(await res.json()); }
        }

        async function deleteLink(code) {
            if(confirm("Delete?")) {
                await fetch(`${API_BASE}/api/links/${code}`, { method: 'DELETE' });
                loadLinks();
            }
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Copied: " + text);
        }

        window.onload = loadLinks;
    </script>
</body>
</html>
